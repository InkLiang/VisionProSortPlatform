  <text x="726" y="390" fill="#5A6B7C" font-size="12">目标Y</text>
  <rect x="770" y="376" width="90" height="26" rx="5" fill="#FFFFFF" stroke="#C4CFDA"/>
  <text x="815" y="393" fill="#1A2B3C" font-size="12" text-anchor="middle">88.0</text>
  <text x="876" y="390" fill="#5A6B7C" font-size="12">目标Z</text>
  <rect x="920" y="376" width="90" height="26" rx="5" fill="#FFFFFF" stroke="#C4CFDA"/>
  <text x="965" y="393" fill="#1A2B3C" font-size="12" text-anchor="middle">240.0</text>
  <rect x="1030" y="374" width="134" height="30" rx="6" fill="#2E6DB4"/>
  <text x="1097" y="394" fill="#FFFFFF" font-size="13" text-anchor="middle">定点运动</text>

  <text x="576" y="440" fill="#1A2B3C" font-size="13" font-weight="600">当前坐标</text>
  <text x="576" y="468" fill="#2E6DB4" font-size="14" font-weight="600">X 120.5</text>
  <text x="700" y="468" fill="#2E6DB4" font-size="14" font-weight="600">Y 88.0</text>
  <text x="824" y="468" fill="#2E6DB4" font-size="14" font-weight="600">Z 240.0</text>

  <text x="576" y="508" fill="#1A2B3C" font-size="13" font-weight="600">执行器</text>
  <rect x="636" y="494" width="110" height="30" rx="6" fill="#2E9E5B"/>
  <text x="691" y="514" fill="#FFFFFF" font-size="13" text-anchor="middle">吸盘吸</text>
  <rect x="756" y="494" width="110" height="30" rx="6" fill="#FFFFFF" stroke="#C4CFDA"/>
  <text x="811" y="514" fill="#1A2B3C" font-size="13" text-anchor="middle">吸盘放</text>

  <text x="576" y="558" fill="#1A2B3C" font-size="13" font-weight="600">队列列表</text>
  <rect x="576" y="570" width="300" height="66" rx="6" fill="#F7F9FB"/>
  <text x="592" y="592" fill="#1A2B3C" font-size="12">1. (120.0, 88.0, 240.0)  吸取</text>
  <text x="592" y="614" fill="#1A2B3C" font-size="12">2. (320.0, 88.0, 240.0)  放OK区</text>
  <text x="592" y="636" fill="#1A2B3C" font-size="12">3. (520.0, 88.0, 240.0)  放NG区</text>
  <rect x="892" y="570" width="120" height="30" rx="6" fill="#FFFFFF" stroke="#C4CFDA"/>
  <text x="952" y="590" fill="#1A2B3C" font-size="13" text-anchor="middle">添加队列</text>
  <rect x="1022" y="570" width="142" height="30" rx="6" fill="#2E6DB4"/>
  <text x="1093" y="590" fill="#FFFFFF" font-size="13" text-anchor="middle">启动队列</text>

  <!-- 底部报警信息框 -->
  <rect x="20" y="668" width="1160" height="46" rx="8" fill="#FFFFFF" stroke="#D8DEE4"/>
