  <rect x="576" y="240" width="100" height="36" rx="6" fill="#2E6DB4"/>
  <text x="626" y="263" fill="#FFFFFF" font-size="14" text-anchor="middle">X＋</text>
  <rect x="686" y="240" width="100" height="36" rx="6" fill="#FFFFFF" stroke="#C4CFDA"/>
  <text x="736" y="263" fill="#1A2B3C" font-size="14" text-anchor="middle">X－</text>
  <rect x="816" y="240" width="100" height="36" rx="6" fill="#2E6DB4"/>
  <text x="866" y="263" fill="#FFFFFF" font-size="14" text-anchor="middle">Y＋</text>
  <rect x="926" y="240" width="100" height="36" rx="6" fill="#FFFFFF" stroke="#C4CFDA"/>
  <text x="976" y="263" fill="#1A2B3C" font-size="14" text-anchor="middle">Y－</text>
  <rect x="1056" y="240" width="100" height="36" rx="6" fill="#2E6DB4"/>
  <text x="1106" y="263" fill="#FFFFFF" font-size="14" text-anchor="middle">Z＋</text>
  <rect x="596" y="288" width="100" height="36" rx="6" fill="#FFFFFF" stroke="#C4CFDA"/>
  <text x="646" y="311" fill="#1A2B3C" font-size="14" text-anchor="middle">Z－</text>

  <text x="576" y="360" fill="#1A2B3C" font-size="13" font-weight="600">目标坐标</text>
